name: Sync Workbench release into live vault
on:
  push:
    paths:
      - '.github/workflows/sync-workbench-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mdse-v2-live-workbench-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current live model
        uses: actions/checkout@v4
      - name: Check out current authoritative tool source
        uses: actions/checkout@v4
        with:
          repository: spencerskelly/MDSE_v2
          # Immutable reviewed toolset revision, not moving main
          ref: 138f3e84686b2e0c1f19f68830cec725c7fec787
          path: _tool_release
          persist-credentials: false
      - name: Set up Node for native TypeScript build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build Workbench from authoritative source
        working-directory: _tool_release
        run: |
          npm run test:workbench
          npm run build:workbench
      - name: Copy and verify generated Obsidian plugin
        run: |
          set -euo pipefail
          source="_tool_release/tools/workbench/dist/plugin"
          destination=".obsidian/plugins/mdse-workbench"
          test -f "00_Tool_Definitions/03 - MDSE Workbench.md"
          test -f "01_Engineering_Workflows/01 - Find and Investigate Engineering Information.md"
          test -f ".obsidian/plugin-lock.yaml"
          test -f "99_System/04_Language/SysML v2 Language.md"
          test "$(node -p 'require("./_tool_release/tools/workbench/manifest.json").version')" = "0.10.1"
          mkdir -p "$destination"
          for filename in main.js manifest.json styles.css; do
            test -s "$source/$filename"
            cp "$source/$filename" "$destination/$filename"
            cmp "$source/$filename" "$destination/$filename"
          done
      - name: Synchronize controlled Workbench lock and check hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path(".obsidian/plugins/mdse-workbench")
          lock = pathlib.Path(".obsidian/plugin-lock.yaml")
          expected_commit = "138f3e84686b2e0c1f19f68830cec725c7fec787"
          version = json.loads((root / "manifest.json").read_text())["version"]
          if version != "0.10.1":
              raise SystemExit(f"Unexpected Workbench version: {version}")
          text = lock.read_text()
          start = text.index("  mdse-workbench:\n")
          end = text.index("  templater-obsidian:\n", start)
          block = text[start:end]
          def change(pattern, new):
              global block
              updated, count = re.subn(pattern, lambda _match: new, block, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Expected one lock field for {pattern}, found {count}")
              block = updated
          change(r'^    version: .+$', '    version: "' + version + '"')
          change(r'^    source: .+$', '    source: "spencerskelly/MDSE_v2@' + expected_commit + '"')
          for name in ("main.js", "manifest.json", "styles.css"):
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              change(r'^      ' + re.escape(name) + r': [0-9a-f]{64}$', '      ' + name + ': ' + digest)
          lock.write_text(text[:start] + block + text[end:])
          print(f"Locked mdse-workbench {version} from {expected_commit}")
          PY
      - name: Validate synchronized Workbench lock against plugin payload
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re
          root=pathlib.Path(".obsidian/plugins/mdse-workbench")
          lock=pathlib.Path(".obsidian/plugin-lock.yaml").read_text()
          block=lock.split("  mdse-workbench:\n",1)[1].split("\n  templater-obsidian:\n",1)[0]
          for file in ("main.js","manifest.json","styles.css"):
              match=re.search(r"^      "+re.escape(file)+r": ([0-9a-f]{64})$",block,re.M)
              if not match or hashlib.sha256((root/file).read_bytes()).hexdigest()!=match.group(1):
                  raise SystemExit(f"Invalid lock for {file}")
          print("Workbench payload hashes match plugin-lock.yaml")
          PY
      - name: Commit only generated plugin to live main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .obsidian/plugins/mdse-workbench .obsidian/plugin-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Sync Workbench 0.10.1 and verified plugin lock from MDSE_v2 #14"
            git push origin HEAD:main
          fi
